[project]
name = "aml-monitoring"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hafeez Ullah", email = "hafizhafeezullah05@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
aml-monitoring = "aml_monitoring:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
